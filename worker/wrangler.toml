name = "i2h-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# HyperDataLab's Cloudflare account (phuong@hyperdatalab.org). Never deploy lab workers to another account.
account_id = "124949a79dc6c5894bc492942593cb51"

[vars]
# Firebase only verifies sign-in tokens now; projects and runs are in D1.
FIREBASE_PROJECT_ID = "hyperdatalab-idea2hypo"
ALLOWED_DOMAIN = "hyperdatalab.org"
ALLOWED_ORIGINS = "https://hyperdatalab-idea2hypo.web.app,https://hyperdatalab-idea2hypo.firebaseapp.com,http://localhost:3000,http://localhost:5000"
PAPERLAB_WORKER_URL = "https://paperlab-pdf-worker.hyperdatalab.workers.dev"
# How the engine container reaches this Worker (event delivery, run-file mirror, lab routes).
INTERNAL_BASE_URL = "https://i2h-worker.hyperdatalab.workers.dev/internal"
# Secrets (owner sets them; never [vars]):
#   npx wrangler secret put ENGINE_KEY      random 32+ bytes, shared with the engine container
#   npx wrangler secret put S2_API_KEY      optional, Semantic Scholar

# The lab's shared bucket: this Worker writes under i2h/ and reads Paper Fetch Hub's papers/.
# Projects, members and run records. Create once: npx wrangler d1 create i2h, put its id here, then
# npx wrangler d1 migrations apply i2h --remote
[[d1_databases]]
binding = "DB"
database_name = "i2h"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "paper-fetch"

[[durable_objects.bindings]]
name = "RUN"
class_name = "RunObject"

[[containers]]
class_name = "EngineContainer"
image = "../Dockerfile"
image_build_context = ".."
instance_type = "standard-1"
max_instances = 1

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "EngineContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunObject", "EngineContainer"]
