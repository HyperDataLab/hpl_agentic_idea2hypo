# Deploys i2h-worker and its engine container (Dockerfile at the repo root) to the HyperDataLab Cloudflare account.
# GitHub runners have Docker, so `wrangler deploy` builds the image here and pushes it to Cloudflare's registry;
# no Docker is needed on a lab machine.
# Runs only when main is pushed to deploy/engine (on the owner's "Deploy now") or by hand, and refuses a commit
# whose `ci` workflow did not succeed.
# Needs the repository secret CLOUDFLARE_API_TOKEN (owner): Workers Scripts, Containers, D1 and Workers R2 Storage
# edit on the HyperDataLab account. Worker secrets (ENGINE_KEY, S2_API_KEY) stay in Cloudflare and are not touched.
name: Deploy engine

on:
  push:
    branches: [deploy/engine]
  workflow_dispatch:

concurrency:
  group: deploy-engine
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          state="$(gh run list -R "$GITHUB_REPOSITORY" --commit "$SHA" --workflow ci --limit 1 \
            --json conclusion,status -q '.[0] | if .status == "completed" then .conclusion else .status end')"
          if [ "$state" != "success" ]; then
            echo "CI on ${SHA:0:7} is '${state:-missing}', not success. Not deploying." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply i2h --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build the engine image and deploy the worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Health
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' https://i2h-worker.hyperdatalab.workers.dev/v1/projects)"
          echo "GET /v1/projects HTTP $code (401 = routed, sign-in required)"
          test "$code" = 401
